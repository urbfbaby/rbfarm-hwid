name = "gkfarm-hwid-worker"
main = "src/index.js"
compatibility_date = "2024-09-25"

# ── Route: intercept yaelahky.com/api/* and /admin/* ──
# After deploy, add Workers Routes in Cloudflare Dashboard:
#   yaelahky.com/api/*   → gkfarm-hwid-worker
#   yaelahky.com/admin/* → gkfarm-hwid-worker

# ── D1 Database Binding ──
[[d1_databases]]
binding = "DB"
database_name = "gkfarm-hwid"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ── Environment Variables ──
# Set these via: wrangler secret put AUTH_SECRET
# Or in wrangler.toml for non-sensitive defaults:
[vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "admin123"
# AUTH_SECRET → set via `wrangler secret put AUTH_SECRET` (do NOT put here)
