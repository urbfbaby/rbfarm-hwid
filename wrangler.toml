name = "gkfarm-hwid-worker"
main = "src/index.js"
compatibility_date = "2024-09-25"

# ── Route: intercept yaelahky.com/api/* and /admin/* ──
routes = [
  { pattern = "yaelahky.com/api/*", zone_name = "yaelahky.com" },
  { pattern = "yaelahky.com/admin/*", zone_name = "yaelahky.com" },
  { pattern = "yaelahky.com/health", zone_name = "yaelahky.com" }
]

# ── D1 Database Binding ──
[[d1_databases]]
binding = "DB"
database_name = "gkfarm-hwid"
database_id = "9d2f09b7-07a4-4904-a0e6-e4b85a9063eb"

# ── Environment Variables ──
# Set these via: wrangler secret put AUTH_SECRET
# Or in wrangler.toml for non-sensitive defaults:
[vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "19maret2003"
# AUTH_SECRET → set via `wrangler secret put AUTH_SECRET` (do NOT put here)
